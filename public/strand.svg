<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<!-- twisted plies: diagonal bands painted along the cord -->
		<pattern id="twist" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)">
			<rect width="13" height="13" fill="#c8483a"/>
			<rect x="1" width="6" height="13" fill="#e26651"/>
			<rect x="10" width="2" height="13" fill="#9a2f25"/>
		</pattern>
	</defs>

	<rect x="16" y="16" width="480" height="480" rx="112" fill="#fffdf8"/>
	<rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#e8e1d4" stroke-width="3"/>

	<g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(256 256) scale(1.12) translate(-258 -262)">
		<!-- loose tail curling out from under the cord's end -->
		<path d="M190 370 C190 430 222 448 242 432 C256 420 248 402 232 408" stroke="#7d241c" stroke-width="16"/>
		<path d="M190 370 C190 430 222 448 242 432 C256 420 248 402 232 408" stroke="url(#twist)" stroke-width="10"/>

		<!-- the cord's shadowed edge, then the twisted body on top -->
		<g stroke="#7d241c" stroke-width="40">
			<path id="main" d="M190 396 C186 330 194 250 190 112"/>
			<path id="branch" d="M190 318 C192 262 330 270 326 200 L324 128"/>
		</g>
		<g stroke="url(#twist)" stroke-width="32">
			<use href="#main"/>
			<use href="#branch"/>
		</g>

		<!-- frayed ends -->
		<g stroke="#c8483a" stroke-width="7">
			<path d="M190 104 C186 86 176 78 168 72"/>
			<path d="M190 104 C192 84 196 74 200 64"/>
			<path d="M190 104 C196 90 208 84 216 80"/>
			<path d="M324 120 C318 100 310 94 302 88"/>
			<path d="M324 120 C326 100 330 88 334 80"/>
			<path d="M324 120 C332 104 342 98 350 96"/>
		</g>

		<!-- knots for commits -->
		<g stroke="#7d241c" stroke-width="12">
			<circle cx="190" cy="214" r="30"/>
			<circle cx="325" cy="214" r="30"/>
			<circle cx="190" cy="356" r="30"/>
		</g>
		<g stroke="url(#twist)" stroke-width="8">
			<circle cx="190" cy="214" r="30"/>
			<circle cx="325" cy="214" r="30"/>
			<circle cx="190" cy="356" r="30"/>
		</g>
	</g>
</svg>
