<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<!-- twisted plies: soft diagonal bands painted along the cord -->
		<pattern id="twist" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-55)">
			<rect width="16" height="16" fill="#f2b42c"/>
			<rect x="2" width="7" height="16" fill="#fbcd55"/>
			<rect x="12" width="2" height="16" fill="#d9951a"/>
		</pattern>
		<radialGradient id="round" cx="0.38" cy="0.34" r="0.7">
			<stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
			<stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
			<stop offset="1" stop-color="#7a4a08" stop-opacity="0.25"/>
		</radialGradient>
	</defs>

	<rect x="16" y="16" width="480" height="480" rx="112" fill="#fffdf6"/>
	<rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ece4d2" stroke-width="3"/>

	<g fill="none" stroke-linecap="round" stroke-linejoin="round">
		<!-- outline, then the twisted body on top -->
		<g stroke="#9a6410" stroke-width="38">
			<path id="main" d="M188 128 L188 384"/>
			<path id="branch" d="M188 330 C188 250 324 262 324 150"/>
		</g>
		<g stroke="url(#twist)" stroke-width="28">
			<use href="#main"/>
			<use href="#branch"/>
		</g>
	</g>

	<!-- a knot tied at each end of the string -->
	<g id="knot">
		<circle cx="188" cy="128" r="40" fill="#9a6410"/>
		<circle cx="188" cy="128" r="33" fill="url(#twist)"/>
		<circle cx="188" cy="128" r="33" fill="url(#round)"/>
		<path d="M166 104 C168 132 184 150 212 152" fill="none" stroke="#9a6410" stroke-width="5" stroke-linecap="round"/>
		<path d="M176 98 C180 120 194 136 218 140" fill="none" stroke="#9a6410" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
	</g>
	<use href="#knot" transform="translate(136 22)"/>
	<use href="#knot" transform="translate(0 256)"/>
</svg>
